name = "ArtGallery"
version = "0.1.0"
defaultTargets = ["ArtGallery", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc2"

[[lean_lib]]
name = "ArtGallery"
globs = ["ArtGallery.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

[[lean_lib]]
name = "Complexity"
globs = ["Complexity.+"]

[[lean_lib]]
name = "PT"
globs = ["PT.+"]
