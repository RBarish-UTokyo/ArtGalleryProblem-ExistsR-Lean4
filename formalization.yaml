# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The Art Gallery Problem is ∃ℝ-complete: point-point, boundary-point and point-boundary variants, in Lean 4"
  description: >-
    A Lean 4 and Mathlib formalization of Abrahamsen, Adamaszek and Miltzow, "The Art Gallery
    Problem is ∃ℝ-complete" (J. ACM 2021), together with Stade's point-boundary variant
    (SoCG 2025), for an explicit single-tape Turing machine model. Lean proves that deciding
    whether a simple polygon with rational corners can be guarded by g guards is ∃ℝ-complete
    under polynomial-time many-one reductions in each of the three variants known to be
    ∃ℝ-complete: point guards guarding the whole polygon (Theorem 1, also for integer corners),
    guards on the boundary guarding the whole polygon (the boundary-point variant of the paper's
    §7.2), and point guards guarding only the boundary (Stade's theorem); that ETR-INV is
    ∃ℝ-complete; that the guard sets of the paper's Section 5 polygon correspond exactly to the
    solutions of an ETR-INV instance (Theorem 54, with the range condition made explicit) and
    encode the solutions of any ETR formula (Theorem 55); that every real algebraic number is
    the x-coordinate of a guard in every optimal guard set of some polygon with rational corners
    (Theorem 2); and that some x-monotone polygon with integer corners can be guarded by three
    guards but needs four rational guards (Theorem 4). The development provides reusable
    material on the existential theory of the reals: formulas and their codes, the class ∃ℝ,
    ETR-INV and ETR-INV-REV with polynomial-time reductions from ETR, and an elementary proof of
    the doubly exponential solution bound that the paper cites from Schaefer and Štefankovič. It
    partially answers the open problem of the paper's §7.2 on the number of variables: all three
    art gallery problems reduce to ETR by formulas whose only variables are the 2g coordinates of the
    guards (the paper uses (n+g)^6 variables for n corners). Point-point and point-boundary
    hardness is proved through Stade's construction; the paper's own Section 5 construction is
    formalized for Theorems 54 and 55, with gadget visibility facts checked as kernel-evaluated
    certificates, and a modification of it (guard segments on shallow bays in the boundary,
    re-laid-out addition gadgets) gives boundary-point hardness. The proofs use only
    the axioms propext, Classical.choice and Quot.sound.
  authors:
    - "Robert D. Barish"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Robert D. Barish"

classification:
  arxiv: [cs.CG, cs.CC]
  msc2020: [68U05, 68Q17, 14P10, 68V20]

sources:
  - title: "The Art Gallery Problem is ∃ℝ-complete"
    authors:
      - "Mikkel Abrahamsen"
      - "Anna Adamaszek"
      - "Tillmann Miltzow"
    type: paper
    location: "Journal of the ACM 69(1), Article 4 (2021); preliminary version STOC 2018. The paper is not included in this repository."
    relationship: formalizes
    note: >-
      Formalized: Theorem 1 (also for integer coordinates), Theorem 2, Theorem 4, Theorem 13
      (membership), Theorem 16 (ETR-INV is ∃ℝ-complete), Theorem 54 (with the range condition
      stated on both sides, see fidelity.divergences), Theorem 55 and the boundary-point variant
      of §7.2. Not formalized: Theorem 3 (the Picasso theorem), Theorem 56 and the
      general-position modification of §7.1. Hardness for Theorem 1 is proved through Stade's
      construction rather than the paper's Section 5; Section 5 is formalized for Theorems 54
      and 55 and, modified, for the boundary-point variant. Issues found in the published
      arguments are listed in docs/paper_issues.md.
    license: "unknown"
    author_endorsement: not-contacted
  - title: "The Point-Boundary Art Gallery Problem is ∃ℝ-hard"
    authors:
      - "Jack Stade"
    type: paper
    id: "arXiv:2210.12817v3"
    location: "SoCG 2025, LIPIcs 332, Paper 74; full version arXiv:2210.12817. The paper is not included in this repository."
    relationship: formalizes
    note: >-
      Formalized: ETR-INV-REV is ∃ℝ-hard (Theorem 2.4) and the point-boundary art gallery problem
      is ∃ℝ-hard (with membership, ∃ℝ-complete). The construction follows the paper's ideas
      (guard regions formed by wedges, copy nooks, inversion and addition gadgets) with explicit
      coordinates of our own; the same polygon also proves Theorem 1 of [AAM].
    license: "unknown"
    author_endorsement: not-contacted
  - title: "Parameterized Hardness of Art Gallery Problems"
    authors:
      - "Édouard Bonnet"
      - "Tillmann Miltzow"
    type: paper
    id: "arXiv:1603.08116"
    location: "ESA 2016"
    relationship: background
    note: >-
      Used only in the informal, ETH-conditional Ω(k / log k) lower bound for the number of
      variables (docs/research/variable_count.md); not formalized.
    author_endorsement: not-contacted
  - title: "Fixed Points, Nash Equilibria, and the Existential Theory of the Reals"
    authors:
      - "Marcus Schaefer"
      - "Daniel Štefankovič"
    type: paper
    location: "Theory of Computing Systems 60 (2017)"
    relationship: background
    note: >-
      Source of the ball bound used by [AAM] as Corollary 18. It is not assumed: the
      formalization proves a bound of the same kind from scratch (ArtGallery/ETR/Ball.lean).
    author_endorsement: not-contacted

