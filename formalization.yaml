      models: ["Claude Opus 5.5 (Anthropic)"]
      framework: "AI coding agents"
      tool_setup: >-
        Claude Opus 5.5 (Anthropic) was used, as agents under the direction of the author, both for the
        Lean formalization and to assist with the documentation. The author set the task, the
        target statements and the requirements. Tools: Lean v4.35.0-rc2 and Lake, Mathlib,
        Python programs with exact rational arithmetic (used during development to compute the
        construction data and generate the certificate files; not part of this repository), the
        toolchain's lake comparator and independent kernels.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "cloud container"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    The author directed the work. Claude Opus 5.5 (Anthropic) assisted with the Lean definitions,
    statements, proofs, the development-time certificate generators (not part of this repository;
    the generated Lean files are checked by the kernel), and the documentation (README.md, this
    file, the Challenge.lean header, the design notes in docs/ and the verification record). Reused files from the author's earlier entries are listed
    in docs/PROVENANCE.md.

fidelity:
  divergences: |-
    - Machine model, polynomial time and reductions are those of PALOMAR-2026-10-02-000013: deterministic single-tape Turing machines over {blank, 0, 1, separator}, time = number of steps, polynomial bounds c * (n + 1)^k, polynomial-time many-one (Karp) reductions. ∃ℝ is the class of languages that reduce to ETR; invariance under other machine models is not proved.
    - ETR formulas are quantifier-free formulas with constants 0, 1, operations +, −, · and relations =, <, ≤ under ¬, ∧, ∨, read existentially; variable indices are coded in unary. Art gallery instances are coded with numerators, denominators, integer coordinates and g in binary.
    - Polygons are lists of corners; simple means at least three distinct corners and any two distinct edges meeting exactly in common endpoints (collinear consecutive corners allowed). The region is the boundary plus the bounded components of its complement; seeing means the closed segment lies in the region. The problems ask for a guard set with exactly g points, which is equivalent to at most g points since guards can be added.
    - Theorem 54 is stated with the range condition x ∈ [1/2, 2]^n on both sides of the equivalence; read literally, the paper's statement is false for n ≥ 2 (docs/paper_issues.md, A2). The shifts are d_i = 27i/2 − 1/2.
    - Theorem 55 states: every guard set has at least g guards; if the formula is satisfiable the polygon has a guard set of size g; every guard set of size g contains guards at (c_i x_i + d_i, 0) for some solution x, with rational c_i ≠ 0. It is derived from Theorem 54 through the ETR → ETR-INV reduction.
    - Hardness of AGP, AGPInt and AGPPointBoundary is proved by a single reduction through Stade's construction (ETR → ETR-INV-REV → polygon), not through [AAM]'s Section 5, whose polygon has no common denominator of polynomial bit length; Theorem 2 is also derived from Stade's construction. Stade's construction and [AAM]'s Section 5 are formalized with explicit coordinates designed for the formalization (e.g. explicit pockets, far witnesses for the middle addition receiver, a single stationary guard per addition gadget, guard count 46n + 16 k_add + 5 k_inv instead of 58n + 20 k_1 + 5 k_2); the design notes in docs/stade/ and docs/section5/ list all deviations.
    - The boundary-point variant ([AAM] §7.2, stated there as an easy adjustment) is proved with a modified Section 5 construction: every guard segment lies on the floor of a shallow bay in the boundary whose side walls carry pinning spikes, and the addition gadgets are re-laid out (the receivers exchange roles; the mechanism of Lemma 41 is unchanged), because in the paper's layout a receiver of every addition gadget is enclosed by mandatory sight lines and cannot lie on the boundary (docs/paper_issues.md, A6; docs/boundary_point/design.md).
    - Corollary 18 of [AAM] (a ball bound cited from Schaefer and Štefankovič) is replaced by a self-contained bound for ETR^{1,+,·} systems with a different explicit exponent.
    - The ETR-INV-REV reduction uses the interval [1, 2] for the second argument of every inversion, proved for the formalization's own ETR → ETR-INV chain.

review:
  status: agent-reviewed
  reviewers:
    - "Claude Opus 5.5 (Anthropic)"
  notes: >-
    The Challenge statement was checked against the papers during the AI-assisted development;
    this check found that Theorem 54 is false when read literally and led to the stated
    correction. The proof is checked by the Lean kernel, and Comparator verifies that the
    solution proves the challenge statement using only the permitted axioms (docs/VERIFICATION.md).
    No human mathematical review or Palomar editorial review is asserted.

alignment:
  namespace: "ArtGallery"
  statements:
    - source: "[AAM] Theorem 1: the art gallery problem is ∃ℝ-complete"
      lean: "ArtGallery.agp_erComplete"
      module: "Solution"
      status: proved
    - source: "[AAM] Theorem 1, integer coordinates"
      lean: "ArtGallery.agpInt_erComplete"
      module: "Solution"
      status: proved
    - source: "[AAM] §7.2: the boundary-point variant is ∃ℝ-complete"
      lean: "ArtGallery.agpBoundaryPoint_erComplete"
      module: "Solution"
      status: proved
      note: "Proved with a modified Section 5 construction (re-laid-out addition gadgets); see fidelity.divergences."
    - source: "[S] Theorem 1.2: the point-boundary art gallery problem is ∃ℝ-hard (with membership: ∃ℝ-complete)"
      lean: "ArtGallery.agpPointBoundary_erComplete"
      module: "Solution"
      status: proved
    - source: "[AAM] Theorem 16: ETR-INV is ∃ℝ-complete"
      lean: "ArtGallery.etrinv_erComplete"
      module: "Solution"
      status: proved
    - source: "[AAM] Theorem 13: the art gallery problem is in ∃ℝ"
      lean: "ArtGallery.agp_inER"
      module: "Solution"
      status: proved
    - source: "[AAM] §7.2 open problem on the number of variables"
      lean: "ArtGallery.agp_inER_guard_variables, ArtGallery.agpBoundaryPoint_inER_guard_variables, ArtGallery.agpPointBoundary_inER_guard_variables"
      module: "Solution"
      status: proved
      note: "2g variables (the guard coordinates) suffice for all three variants; a matching ETH-conditional lower bound is argued informally only."
    - source: "[AAM] Theorem 54"
      lean: "ArtGallery.etrinv_guard_correspondence"
      module: "Solution"
      status: adapted
      note: "Range condition on both sides of the equivalence (the literal statement is false for n ≥ 2)."
    - source: "[AAM] Theorem 55"
      lean: "ArtGallery.etr_guard_correspondence"
      module: "Solution"
      status: proved
    - source: "[AAM] Theorem 2"
      lean: "ArtGallery.algebraic_guard_coordinate"
      module: "Solution"
      status: proved
    - source: "[AAM] Theorem 4"
      lean: "ArtGallery.irrational_guards_needed"
      module: "Solution"
      status: proved

