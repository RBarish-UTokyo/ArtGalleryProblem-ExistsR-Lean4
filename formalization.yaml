status:
  scope: >-
    Proved: the thirteen compared theorems for the definitions of Challenge.lean. On the way:
    the ETR → ETR-INV and ETR → ETR-INV-REV reductions with their polynomial-time proofs; an
    elementary doubly exponential solution bound for ETR^{1,+,·} systems; membership of the
    point-point, boundary-point and point-boundary art gallery problems in ∃ℝ by formulas in the
    2g guard coordinates; Stade's construction (simplicity, lower bound, guards encode solutions,
    solutions give guards, polynomial time, integer scaling); the Section 5 construction of
    [AAM] (simplicity, guard count, pinning, copies, gadget constraints, coverage); its
    boundary-point modification (bays, re-laid-out addition gadgets, counting for guards on the
    boundary, coverage, polynomial time); a library of
    visibility tools for polygons with verified certificate checkers. Not formalized: the
    Picasso theorem (Theorem 3) and Theorem 56 (their published proof has a gap, and they are not
    needed for the complexity results), the general-position modification of §7.1, and the
    ETH-conditional lower bound on the number of variables (informal argument only).
